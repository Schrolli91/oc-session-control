name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.4.0
      - run: npm ci
      - run: npm run build
      # Dashboard rendering tests require OpenTUI FFI (Node >= 26.4).
      - run: node --conditions=browser --experimental-ffi --test "src/**/*.test.mjs"
      - run: npm run check
      - run: npm pack
      - run: tar -tzf oc-session-control-*.tgz | grep -qx 'package/dist/tui.js'
