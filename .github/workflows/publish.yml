name: Publish

# Runs three ways:
#   - workflow_call from the Release workflow (the normal path: tag and
#     GitHub Release are created with GITHUB_TOKEN, which does NOT trigger
#     the `push: tags` event below)
#   - push of a v* tag (manual `git push --tags` from a machine)
#   - workflow_dispatch (manual re-run)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  workflow_call:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.4.0
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run check
      - run: npm publish --provenance --access public
