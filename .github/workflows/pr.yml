name: PR

# The type list below is the repo-wide commit vocabulary: it decides the squash
# commit on main, the labels, and (via release-please) the CHANGELOG sections.
# If you add a type here, add it to changelog-sections in
# release-please-config.json too, otherwise that type never shows up in
# CHANGELOG.md. release-please itself opens its PR as
# `chore(main): release X.Y.Z`, which must keep matching this pattern.

# pull_request_target so PRs from forks are covered too (they only get a
# read-only token on plain pull_request events). Safety rules for this file:
# never check out or execute anything from the PR, pass the PR title only
# through env:, and talk to nothing but the API. The workflow always runs
# the version from main, so a PR cannot tamper with these jobs.

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|refactor|test|ci|chore|deps)(\([a-z0-9][a-z0-9._/-]*\))?!?: .+$'

          if [[ "$TITLE" =~ $pattern ]]; then
            echo "PR title is valid: $TITLE"
            exit 0
          fi

          {
            echo "### PR title does not follow Conventional Commits"
            echo
            echo "Received: \`$TITLE\`"
            echo
            echo "Expected: \`<type>(<scope>)!: <description>\`"
            echo
            echo "- type: feat, fix, docs, refactor, test, ci, chore, deps"
            echo "- scope: optional, lowercase"
            echo "- \`!\` before the colon marks a breaking change"
            echo
            echo "Examples: \`fix: guard against empty session list\`, \`feat(tui)!: drop node 20 support\`, \`deps: bump @opencode/plugin\`"
            echo
            echo "The PR title becomes the squash commit on main and feeds the changelog."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error::PR title must match '<type>(<scope>)!: <description>' (got: $TITLE)"
          exit 1

  label:
    needs: pr-title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Apply type label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          type="${TITLE%%(*}"
          type="${type%%!*}"
          type="${type%%:*}"

          case "$type" in
            feat)   label="feature" ;;
            fix)    label="bug" ;;
            test)   label="tests" ;;
            docs|refactor|ci|chore) label="$type" ;;
            deps)   label="dependencies" ;;
            *)
              echo "::error::Unmapped type '$type'"
              exit 1
              ;;
          esac

          all="feature,bug,docs,refactor,tests,ci,chore,dependencies"
          remove="${all//$label/}"
          remove="${remove//,,/,}"
          remove="${remove%,}"
          remove="${remove#,}"

          add="$label"
          breaking_re='^[a-z]+(\([^)]*\))?!:'
          if [[ "$TITLE" =~ $breaking_re ]]; then
            add="$add,breaking-change"
            echo "Breaking change detected"
          else
            remove="${remove:+$remove,}breaking-change"
          fi

          gh pr edit "$PR" --repo "$REPO" --remove-label "$remove" --add-label "$add"
          echo "Labelled PR #$PR as '$add'"
