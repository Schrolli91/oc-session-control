name: PR

# Label from the default-branch workflow so fork PRs need no unsafe checkout.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Keep accepted types aligned with the label map and release-please.
          pattern='^(feat|fix|docs|refactor|test|ci|chore|deps)(\([a-z0-9][a-z0-9._/-]*\))?!?: .+$'

          if [[ "$TITLE" =~ $pattern ]]; then
            echo "PR title is valid"
            exit 0
          fi

          {
            echo "### PR title does not follow Conventional Commits"
            echo
            echo "Expected: \`<type>(<scope>)!: <description>\`"
            echo
            echo "- type: feat, fix, docs, refactor, test, ci, chore, deps"
            echo "- scope: optional, lowercase"
            echo "- \`!\` before the colon marks a breaking change"
            echo
            echo "Examples: \`fix: guard against empty session list\`, \`feat(tui)!: drop node 20 support\`, \`deps: bump @opencode/plugin\`"
            echo
            echo "The PR title becomes the squash commit on main and feeds the changelog."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error::PR title is invalid; see the job summary for details."
          exit 1

  label:
    needs: pr-title
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Apply type label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pr="$PR_NUMBER"

          type="${TITLE%%(*}"
          type="${type%%!*}"
          type="${type%%:*}"

          case "$type" in
            feat)   label="feature" ;;
            fix)    label="bug" ;;
            test)   label="tests" ;;
            docs|refactor|ci|chore) label="$type" ;;
            deps)   label="dependencies" ;;
            *)
              echo "::error::Unmapped PR title type; check the title and label mapping."
              exit 1
              ;;
          esac

          # Delimiters prevent matching `ci` inside `dependencies`.
          all=",feature,bug,docs,refactor,tests,ci,chore,dependencies,"
          remove="${all//,$label,/,}"
          remove="${remove#,}"
          remove="${remove%,}"

          add="$label"
          breaking_re='^[a-z]+(\([^)]*\))?!:'
          if [[ "$TITLE" =~ $breaking_re ]]; then
            add="$add,breaking-change"
            echo "Breaking change detected"
          else
            remove="${remove:+$remove,}breaking-change"
          fi

          gh pr edit "$pr" --repo "$REPO" --remove-label "$remove" --add-label "$add"
          echo "Labelled PR #$pr as '$add'"
