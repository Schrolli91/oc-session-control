name: Release

# release-please accumulates conventional commits from main into a release PR
# (package.json bump + CHANGELOG.md). Merging that PR creates the tag and the
# GitHub Release, and then calls Publish via workflow_call — a tag pushed with
# GITHUB_TOKEN does NOT trigger `push: tags`, so Publish cannot rely on that.
#
# Only feat/fix/deps/breaking commits open a release PR; chore/ci/docs/...
# land in the changelog of the next one but do not trigger a release by
# themselves. Force one with a `Release-As: X.Y.Z` footer in a commit body.

on:
  push:
    branches: [main]

permissions:
  contents: write
  # the release PR is labelled via the issues API
  issues: write
  pull-requests: write

# serialize: two quick merges must not fight over the same release PR
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish.yml
