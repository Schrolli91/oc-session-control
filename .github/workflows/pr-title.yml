name: PR Title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|refactor|test|ci|chore)(\([a-z0-9][a-z0-9._/-]*\))?!?: .+$'

          if [[ "$TITLE" =~ $pattern ]]; then
            echo "PR title is valid: $TITLE"
            exit 0
          fi

          {
            echo "### PR title does not follow Conventional Commits"
            echo
            echo "Received: \`$TITLE\`"
            echo
            echo "Expected: \`<type>(<scope>)!: <description>\`"
            echo
            echo "- type: feat, fix, docs, refactor, test, ci, chore"
            echo "- scope: optional, lowercase"
            echo "- \`!\` before the colon marks a breaking change"
            echo
            echo "Examples: \`fix: guard against empty session list\`, \`feat(tui)!: drop node 20 support\`"
            echo
            echo "The PR title becomes the squash commit on main and feeds the changelog."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error::PR title must match '<type>(<scope>)!: <description>' (got: $TITLE)"
          exit 1

  # Best effort only: forks get a read-only token, so this may fail there.
  # The required check is "pr-title" (validation), never this job.
  label:
    needs: pr-title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    continue-on-error: true
    steps:
      - name: Apply type label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          type="${TITLE%%(*}"
          type="${type%%!*}"
          type="${type%%:*}"

          case "$type" in
            feat)   label="feature" ;;
            fix)    label="bug" ;;
            test)   label="tests" ;;
            docs|refactor|ci|chore) label="$type" ;;
            *)
              echo "::error::Unmapped type '$type'"
              exit 1
              ;;
          esac

          all="feature,bug,docs,refactor,tests,ci,chore"
          remove="${all//$label/}"
          remove="${remove//,,/,}"
          remove="${remove%,}"
          remove="${remove#,}"

          add="$label"
          breaking_re='^[a-z]+(\([^)]*\))?!:'
          if [[ "$TITLE" =~ $breaking_re ]]; then
            add="$add,breaking-change"
            echo "Breaking change detected"
          else
            remove="${remove:+$remove,}breaking-change"
          fi

          gh pr edit "$PR" --repo "$REPO" --remove-label "$remove" --add-label "$add"
          echo "Labelled PR #$PR as '$add'"
