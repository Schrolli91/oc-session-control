name: Tests

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.4.0
      - run: npm ci
      - run: npm run build
      # Dashboard rendering tests require OpenTUI FFI (Node >= 26.4).
      - run: node --experimental-ffi --test "src/**/*.test.mjs"
      - run: npm run check
      - run: npm pack
      - run: tar -tzf oc-session-control-*.tgz | grep -qx 'package/dist/tui.js'
